# Рубрика первичного ревью ADR/RFC.
# Единственный источник правды о том, ЧТО проверяем. Промпты и отчёт строятся от неё.
#
# Поля:
#   id            — стабильный идентификатор, на него ссылаются вердикты и feedback; не переименовывать
#   title         — короткое имя для отчёта
#   question      — проверка, сформулированная как вопрос с ответом да/нет
#   severity      — blocker | question | nit
#                   blocker: без этого ADR не читаем дальше
#                   question: надо спросить автора, но чтению не мешает
#                   nit: придирка, упоминаем в конце
#   evidence      — что в тексте ADR считается доказательством «да»; нет доказательства — нет pass
#   norms         — файлы нормативной базы, на которые опирается проверка (для этапа 3)
#   applicability — когда пункт применим; если условие не выполнено, вердикт n-a
#   hints         — подсказки для живого MCP-поиска по Confluence на этапе 3

items:
  - id: nfr-class
    title: Класс критичности
    question: "Определён класс критичности (BO / BC / MC) и NFR availability соответствует этому классу?"
    severity: blocker
    evidence: "Явно назван класс критичности и приведены целевые цифры доступности, совместимые с требованиями класса"
    norms: [norms/nfr-classes.md]

  - id: scalability-load
    title: Масштабирование и нагрузка
    question: "Приведены графики/оценки для Scalability и оценена вероятная нагрузка на другие системы?"
    severity: blocker
    evidence: "Числовые оценки или графики нагрузки (RPS, объёмы, рост) и явная оценка влияния на смежные системы"

  - id: integrations-list
    title: Новые интеграции
    question: "Перечислены все новые интеграции с другими системами?"
    severity: question
    evidence: "Явный список новых интеграций либо явное утверждение, что новых интеграций нет"

  - id: integrations-necessity
    title: Нужность интеграций
    question: "Обоснована необходимость каждой новой интеграции — или показано, что без неё нельзя обойтись?"
    severity: question
    evidence: "Для каждой интеграции есть объяснение, зачем она, и рассмотрена альтернатива без неё"
    applicability: "Только если в ADR заявлены новые интеграции"

  - id: integrations-reliability
    title: Надёжность контрагентов
    question: "Оценена доступность/надёжность систем, с которыми появляется интеграция, и её соответствие классу критичности решения?"
    severity: blocker
    evidence: "Названы классы критичности/SLA систем-контрагентов; зависимость критичной системы от менее критичной отмечена и обработана"
    applicability: "Только если в ADR заявлены новые интеграции"
    hints: ["класс критичности <система>", "SLA <система>", "паспорт системы <система>"]

  - id: integrations-security
    title: Безопасность интеграций
    question: "Рассмотрена безопасность новых интеграций (аутентификация, авторизация, передаваемые данные)?"
    severity: blocker
    evidence: "Описан способ аутентификации/авторизации и состав передаваемых данных; чувствительные данные отмечены"
    applicability: "Только если в ADR заявлены новые интеграции"
    norms: [norms/ib-requirements.md]

  - id: tco
    title: TCO решения
    question: "Оценена стоимость разработки, поддержки и эксплуатации решения (TCO)?"
    severity: blocker
    evidence: "Оценки по трём составляющим: разработка, поддержка, эксплуатация (инфраструктура)"

  - id: expected-effect
    title: Ожидаемый эффект
    question: "Сформулирован ожидаемый эффект от решения и способ его измерения?"
    severity: blocker
    evidence: "Названы измеримые метрики эффекта и способ/точка их измерения"

  - id: t-lego
    title: Готовые решения T-Lego
    question: "Рассмотрены готовые решения из T-Lego до того, как изобретать своё?"
    severity: question
    evidence: "Явное упоминание рассмотренных компонентов T-Lego и причин, почему они (не) подошли"
    norms: [norms/t-lego.md]
    hints: ["T-Lego <тип компонента>"]

  - id: ib-approval
    title: Согласование с ИБ
    question: "Есть согласование с ИБ или зафиксирован план его получения?"
    severity: blocker
    evidence: "Ссылка на согласование/заявку в ИБ либо явный статус процесса согласования"
    norms: [norms/ib-requirements.md]

  - id: business-reqs
    title: Требования бизнеса
    question: "Сформулированы требования бизнеса, из которых следует решение?"
    severity: blocker
    evidence: "Явный раздел с бизнес-требованиями или ссылка на них; решение прослеживается к требованиям"

  - id: alternatives
    title: Варианты решения
    question: "Рассмотрено больше одного варианта решения, и у каждого варианта есть оценка TCO?"
    severity: blocker
    evidence: "Минимум два содержательно разных варианта; у каждого — сравнимая оценка стоимости"

  - id: decision-criteria
    title: Критерии выбора
    question: "Названы критерии, по которым выбран итоговый вариант?"
    severity: question
    evidence: "Явный список критериев и сопоставление вариантов по ним (таблица или текст)"

  - id: consequences
    title: Последствия
    question: "Описаны последствия решения — риски, ограничения, обратимость, что станет сложнее?"
    severity: question
    evidence: "Раздел о последствиях/рисках с содержательными пунктами, а не отпиской"
